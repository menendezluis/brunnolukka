<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../src/icon.png" type="image/png" />
    <title>Brunno Lukka — Last Set</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #00f0ff;
      }
    </style>
  </head>
  <body>
    <p id="msg">Opening last set…</p>
    <script src="../redirects.js"></script>
    <script>
      (function () {
        var entry = window.BRUNNO_REDIRECTS && window.BRUNNO_REDIRECTS.lastset;
        if (!entry || !entry.url) {
          document.getElementById("msg").textContent = "Redirect not configured.";
          return;
        }
        document.getElementById("msg").innerHTML =
          'Opening <strong>' +
          (entry.label || "last set") +
          '</strong>… <a href="' +
          entry.url +
          '">tap here if nothing happens</a>';
        window.location.replace(entry.url);
      })();
    </script>
  </body>
</html>
